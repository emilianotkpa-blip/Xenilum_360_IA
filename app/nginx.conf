server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # App interna: no debe aparecer en Google. El encabezado cubre TODO lo que sale de aquí
  # —HTML, JS, imágenes, manifest— y llega antes que la <meta> del index.html.
  #
  # OJO, trampa de nginx: un add_header dentro de un location ANULA todos los del server,
  # no se suman. Por eso se repite en cada location que pone sus propios encabezados; si
  # no, justo index.html —lo que Google indexa— saldría sin él.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  # Compresión
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Service worker: nunca cachear y permitir controlar todo el sitio
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    default_type application/javascript;
  }

  # Manifest PWA con su mime correcto (.webmanifest no está en el mime.types por defecto)
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    default_type application/manifest+json;
  }

  # Assets con hash en el nombre (Vite) → cache larga inmutable
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  # SPA: cualquier ruta desconocida sirve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
